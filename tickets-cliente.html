<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Suporte - GESISTEC</title>
    <link rel="stylesheet" href="style-tickets.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-layout-full">
        <main class="main-content-full">
            <header class="top-bar">
                <div class="logo-horizontal">
                    <h1>GESISTEC</h1>
                    <span>Gestão Tecnológica</span>
                </div>
                <div class="header-right">
                    <h2 id="saudacao">Olá, Usina Cerradinho!</h2>
                    <nav class="top-nav">
                        <button onclick="carregarTickets()"><i class="fas fa-ticket-alt"></i> Meus Chamados</button>
                        <button onclick="abrirModal()"><i class="fas fa-plus-circle"></i> Novo Ticket</button>
                        <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
                    </nav>
                </div>
            </header>

            <section class="dashboard-overview">
                <div class="info-card">
                    <span class="label">Total de Chamados</span>
                    <h3 id="countTotal">0</h3>
                </div>
                <div class="info-card warning">
                    <span class="label">Em Aberto</span>
                    <h3 id="countPendente">0</h3>
                </div>
            </section>

            <section class="table-container">
                <div class="table-header">
                    <h3>Lista de Atendimentos</h3>
                </div>
                <div class="table-responsive">
                    <table id="tabelaChamados">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Assunto</th>
                                <th>Prioridade</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaTickets"></tbody>
                    </table>
                </div>
            </section>

            <template id="templateInteracao">
    <tr class="row-interacao">
        <td colspan="5">
            <div class="inline-detail-container">
                <header class="detail-header-bar">
                    <div class="header-left">
                        <div class="breadcrumb-container">
                            <span class="breadcrumb-text">Tickets</span>
                            <span class="breadcrumb-separator">/</span>
                            <span class="breadcrumb-id">#<span id="ticketIdDisplay"></span></span>
                        </div>
                        <div class="title-row">
                            <span class="badge-vencido">Vencida</span>
                            <i class="fas fa-lock-open status-icon-open"></i>
                            <h4 class="ticket-main-title">Requisição de Melhoria</h4>
                        </div>
                    </div>
                    <div class="detail-actions">
                        <button class="btn-action-icon"><i class="far fa-star"></i></button>
                        <button class="btn-action">Compartilhar</button>
                        <button class="btn-action">Editar</button>
                        <button class="btn-action primary-action" onclick="document.getElementById('reply-text').focus()">Responder</button>
                        <button class="btn-action">Associar</button>
                        <div class="action-divider"></div>
                        <button class="btn-action close-action" onclick="fecharInline(this)">Fechar</button>
                    </div>
                </header>

                <div class="detail-body">
                    <div class="main-info">
                        <nav class="detail-tabs">
                            <button class="active">Detalhes</button>
                            <button>Tickets relacionados</button>
                            <button>Tarefas</button>
                            <button>Ativos</button>
                            <button>Associações</button>
                            <button>Aprovações <span class="tab-badge">2</span></button>
                            <button>Atividade</button>
                            <button>Resolução</button>
                        </nav>
                        
                        <div class="content-scroll-area">
                            <p class="content-label">Mais detalhes da solicitação:</p>
                            <p id="descDoc" class="main-description">Carregando...</p>
                            
                            <div id="historicoChat" class="chat-flow"></div>

                            <div class="reply-container">
                                <textarea id="reply-text" class="reply-input" placeholder="Escreva a sua resposta aqui..."></textarea>
                                <div class="reply-actions">
                                    <div class="action-left">
                                        <input type="file" id="file-input" style="display:none" onchange="prepararAnexo(this)">
                                        <button type="button" class="btn-reply-attach" onclick="document.getElementById('file-input').click()">
                                            <i class="fas fa-paperclip"></i> Anexar Ficheiro
                                        </button>
                                        <span id="file-preview-name"></span>
                                    </div>
                                    <button type="button" class="btn-reply-send" onclick="enviarRespostaCliente(ticketAbertoId)">
                                        Enviar Resposta <i class="fas fa-paper-plane"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="attachments-table-area" style="margin-top: 30px;">
                                <h5>Documentos do Chamado <span class="badge-blue-count" id="countAnexos">0</span></h5>
                                <table class="inner-table">
                                    <thead>
                                        <tr><th>Anexo</th><th>Tamanho</th><th>Anexado em</th><th>Anexado por</th></tr>
                                    </thead>
                                    <tbody id="listaAnexosDetalhada"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <aside class="detail-sidebar-rich">
                        <div class="side-card">
                            <div class="side-tags"><span class="tag-it">GESISTEC</span></div>
                            <h3 class="status-title-side">Pendente</h3>
                            <div class="side-prop">
                                <span class="label-sm">Prioridade</span>
                                <div class="priority-row">
                                    <span class="square-blue"></span>
                                    <span id="displayPrioridade">Média</span>
                                </div>
                            </div>
                            <div class="side-prop">
                                <span class="label-sm">SLA de Resolução</span>
                                <div class="sla-row">
                                    <span class="date-sm" id="dataCriacaoDisplay">---</span>
                                    <span class="badge-sla" id="slaDisplay"><i class="far fa-clock"></i> ---</span>
                                </div>
                            </div>
                        </div>

                        <div class="side-card">
                            <div class="card-header-sm"><i class="far fa-user"></i> <span>Solicitante</span></div>
                            <div class="requester-box">
                                <div class="avatar-circle">U</div>
                                <div class="req-data">
                                    <strong id="solicitanteDoc">usina@cliente.com</strong>
                                    <span>Usina Cerradinho</span>
                                </div>
                            </div>
                            <button class="btn-link">Ver mais detalhes</button>
                        </div>

                        <div class="side-card">
                            <div class="card-header-sm"><i class="far fa-comments"></i> <span>Colaborar</span></div>
                            <button class="btn-teams-side"><i class="fab fa-microsoft-teams"></i> Teams <i class="fas fa-caret-down"></i></button>
                            <button class="btn-add-collab"><i class="fas fa-plus-circle"></i> Começar novo</button>
                        </div>

                        <div class="side-card">
                            <div class="card-header-sm"><i class="far fa-list-alt"></i> <span>Propriedades</span></div>
                            <div class="edit-fields-grid">
                                <div class="field">
                                    <label>Prioridade *</label>
                                    <select id="editPrio"><option>Baixa</option><option selected>Média</option><option>Alta</option></select>
                                </div>
                                <div class="field">
                                    <label>Status</label>
                                    <select id="editStatus"><option value="Pendente">Pendente</option><option value="Finalizado">Finalizado</option></select>
                                </div>
                                <button class="btn-update-action" onclick="salvarEdicaoInline()">Atualizar</button>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>
        </td>
    </tr>
</template>

   <div id="modalTicket" class="modal">
    <div class="modal-content">

        <div class="modal-header">
            <div class="modal-title-group">
                <i class="fas fa-plus-circle"></i>
                <h3>Abrir Novo Chamado</h3>
            </div>
            <button onclick="fecharModal()" class="close-btn">&times;</button>
        </div>

        <form id="formTicket">
            <div class="modal-body">

                <div class="form-group">
                    <label>Assunto <span class="required">*</span></label>
                    <input type="text" id="assunto" required>
                </div>

                <div class="form-group">
                    <label>Prioridade</label>
                    <select id="prioridade">
                        <option value="Baixa">Baixa</option>
                        <option value="Média" selected>Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="descricao"></textarea>
                </div>

                <div class="form-group">
                    <label>Anexo</label>
                    <input type="file" id="anexoTicket">
                </div>

                <!-- PREVIEW -->
                <div id="previewAnexoTicket" style="display:none;">
                    <strong id="nomePreviewTicket"></strong>
                    <span id="tamanhoPreviewTicket"></span>
                    <button type="button" onclick="removerPreviewTicket()">Remover</button>
                </div>

            </div>

            <div class="modal-footer">
                <button type="button" onclick="fecharModal()">Cancelar</button>
                <button type="submit">Criar Chamado</button>
            </div>
        </form>

    </div>
</div>

    <script src="app-tickets.js"></script>
</body>
</html>
