<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Suporte - GESISTEC</title>
    <link rel="stylesheet" href="style-tickets.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo-area">
                <h1>GESISTEC</h1>
                <span>Gestão Tecnológica</span>
            </div>
            <nav class="side-nav">
                <a href="#" class="active"><i class="fas fa-ticket-alt"></i> Meus Chamados</a>
                <a href="#"><i class="fas fa-plus-circle"></i> Novo Ticket</a>
                <a href="#"><i class="fas fa-history"></i> Histórico</a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h2 id="saudacao">Olá, Usina Cerradinho!</h2>
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                    <span id="perfilUsuario">Cliente</span>
                </div>
            </header>

            <section class="dashboard-overview">
                <div class="info-card">
                    <span class="label">Total de Chamados</span>
                    <h3 id="countTotal">0</h3>
                </div>
                <div class="info-card warning">
                    <span class="label">Em Aberto</span>
                    <h3 id="countPendente">0</h3>
                </div>
            </section>

            <section class="table-container">
                <div class="table-header">
                    <h3>Lista de Atendimentos</h3>
                    <button class="btn-primary" onclick="abrirModal()">
                        <i class="fas fa-plus"></i> Abrir Novo Ticket
                    </button>
                </div>

                <div class="table-responsive">
                    <table id="tabelaChamados">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Assunto</th>
                                <th>Prioridade</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaTickets">
                            </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="modalTicket" class="modal">
        <div class="modal-content">
    <div class="modal-header">
        <h3><i class="fas fa-edit"></i> Abrir Novo Chamado</h3>
        <button onclick="fecharModal()" class="close-btn">&times;</button>
    </div>
    
    <form id="formTicket"> 
        <div class="form-group">
            <label for="assunto">Assunto</label>
            <input type="text" id="assunto" required placeholder="Ex: Erro no cálculo de custo agrícola">
        </div>
        
        <div class="form-group">
            <label for="prioridade">Prioridade</label>
            <select id="prioridade">
                <option value="Baixa">Baixa</option>
                <option value="Média" selected>Média</option>
                <option value="Alta">Alta</option>
            </select>
        </div>

        <div class="form-group">
            <label for="descricao">Relato do Problema</label>
            <textarea id="descricao" rows="5" required placeholder="Descreva os detalhes da sua solicitação para a equipe técnica..."></textarea>
        </div>

        <div class="form-actions">
            <button type="button" onclick="fecharModal()" class="btn-cancelar">Cancelar</button>
            <button type="submit" class="btn-primary">Enviar Chamado</button>
        </div>
    </form>
</div>
        </div>

    <script src="app-tickets.js"></script>
</body>
</html>
