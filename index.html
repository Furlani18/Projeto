<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GESISTEC Gestão Tecnológica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-page-full">
        <main class="login-card">
            <header class="login-header">
                <div class="logo-horizontal">
                    <h1>GESISTEC</h1>
                    <span>Gestão Tecnológica</span>
                </div>
                <!-- Subtítulo ajustado para ser genérico -->
                <p class="login-subtitle">Bem-vindo ao portal de gestão</p>
            </header>

            <!-- A seção 'role-selector' foi removida daqui -->

            <form id="loginForm" class="login-form">
                <!-- O input hidden 'perfilSelecionado' foi removido, pois o perfil virá do banco -->

                <div class="form-group">
                    <label for="email">E-mail Corporativo</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope"></i>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Senha</label>
                        <a href="#" class="forgot-link">Esqueceu a senha?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-login-submit">
                    Acessar Portal <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <footer class="login-footer">
                <p>&copy; 2026 GESISTEC - Todos os direitos reservados.</p>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
