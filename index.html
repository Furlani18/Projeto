<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GESISTEC Gestão Tecnológica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-page-full">
        <main class="login-card">
            <header class="login-header">
                <div class="logo-horizontal">
                    <h1>GESISTEC</h1>
                    <span>Gestão Tecnológica</span>
                </div>
                <p class="login-subtitle">Selecione seu perfil para acessar o portal</p>
            </header>

            <div class="role-selector">
                <button type="button" id="btn-cliente" class="role-btn active" onclick="selecionarPerfil('cliente')">
                    <i class="fas fa-user"></i>
                    <span>Cliente</span>
                </button>
                <button type="button" id="btn-equipe" class="role-btn" onclick="selecionarPerfil('colaborador')">
                    <i class="fas fa-headset"></i>
                    <span>Equipe</span>
                </button>
            </div>

            <form id="loginForm" class="login-form">
                <input type="hidden" id="perfilSelecionado" value="cliente">

                <div class="form-group">
                    <label for="email">E-mail Corporativo</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope"></i>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Senha</label>
                        <a href="#" class="forgot-link">Esqueceu a senha?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-login-submit">
                    Entrar no Sistema <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <footer class="login-footer">
                <p>&copy; 2026 GESISTEC - Todos os direitos reservados.</p>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
