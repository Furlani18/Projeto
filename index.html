<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GESISTEC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>GESISTEC</h2> 
            <p>Gerenciamento de Sistemas de Tecnologia</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-mail</label> <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label> <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-footer">
                    <a href="#" class="forgot-password">Esqueceu a senha?</a> </div>

                <button type="submit" class="btn-entrar">Entrar</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
